tion","steps":["在 x 趋零时分子分母均趋 0，为 0/0 未定式。","可用经典基本极限 \\(\\sin x/x\\to1\\)；若已独立建立 \\((\\sin x)'=\\cos x\\)，洛必达亦得 \\(\\cos x/1\\to1\\)。"],"errors":[{"type":"rule_misapplication","signature":"把洛必达用于不是 0/0 或 ∞/∞ 的情形","wrong":"任何商都可以直接各自求导然后相除。"},{"type":"proof_gap","signature":"在证明正弦导数时循环使用洛必达","wrong":"直接用洛必达证明 \\(\\sin x/x=1\\)，又用这极限证明 \\((\\sin x)'=\\cos x\\)，作为独立证明。"}],"pseudo":"能流畅解释洛必达法则术语，却不能指出适用条件或避免循环论证。","probes":[{"stem":"\\(\\lim_{x\\to0}\\frac{1+x}{2+x}\\) 需洛必达吗？","answer":"不需要，直接代入得 1/2，且不是未定式。"},{"stem":"为什么不能未经检查就对任意商使用洛必达？","answer":"必须满足规定的未定式形式与可导、分母导数及导数商极限等条件。"}],"hint":"先判断极限形式，再确认工具是否适用，避免循环论证。","responses":[{"answer":"我先看关键条件：在 x 趋零时分子分母均趋 0，为 0/0 未定式。 接着，可用经典基本极限 \\(\\sin x/x\\to1\\)；若已独立建立 \\((\\sin x)'=\\cos x\\)，洛必达亦得 \\(\\cos x/1\\to1\\)。 因而 极限为 1；此处在满足可导等条件下可用洛必达法则","correctness":"correct"},{"answer":"我觉得：任何商都可以直接各自求导然后相除。","correctness":"incorrect"},{"answer":"我认为：直接用洛必达证明 \\(\\sin x/x=1\\)，又用这极限证明 \\((\\sin x)'=\\cos x\\)，作为独立证明。","correctness":"incorrect"},{"answer":"我记得结论是：极限为 1；此处在满足可导等条件下可用洛必达法则。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"CAL-008","domain":"微积分与数学分析","education_stage":"大学低年级","difficulty":"D4","topic":"定积分的符号面积","concept_id":"C-CAL-006","stem":"计算 \\(\\int_{-1}^{1}x\\,dx\\)，并解释为什么积分为零不代表几何面积为零。","correct_answer":"定积分为 0；曲线与 x 轴围成的几何面积为 1","split":"train","steps":["函数 x 是奇函数，在对称区间的有向面积正负抵消，积分为 0。","几何面积为 \\(\\int_{-1}^1|x|dx=2\\int_0^1x\\,dx=1\\)。"],"errors":[{"type":"sign_error","signature":"将积分值等同无符号面积","wrong":"积分为 0，所以所围面积为 0。"},{"type":"rule_misapplication","signature":"把负半轴下方贡献也算为正","wrong":"\\(\\int_{-1}^1x\\,dx=1\\)。"}],"pseudo":"会利用奇函数算零，却解释成没有任何曲边区域","probes":[{"stem":"\\(\\int_{-2}^{2}x\\,dx\\) 的值？","answer":"0。"},{"stem":"要计算曲线和横轴之间的面积，为什么积分中常用绝对值？","answer":"几何面积非负，原函数的定积分是有符号的累积。"}],"hint":"画出 x 轴上、下两个三角形，分清有向量与几何面积。","responses":[{"answer":"我先看关键条件：函数 x 是奇函数，在对称区间的有向面积正负抵消，积分为 0。 接着，几何面积为 \\(\\int_{-1}^1|x|dx=2\\int_0^1x\\,dx=1\\)。 因而 定积分为 0；曲线与 x 轴围成的几何面积为 1","correctness":"correct"},{"answer":"我觉得：积分为 0，所以所围面积为 0。","correctness":"incorrect"},{"answer":"我认为：\\(\\int_{-1}^1x\\,dx=1\\)。","correctness":"incorrect"},{"answer":"我记得结论是：定积分为 0；曲线与 x 轴围成的几何面积为 1。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"CAL-009","domain":"微积分与数学分析","education_stage":"大学低年级","difficulty":"D5","topic":"分段函数可导性边界","concept_id":"C-CAL-003","stem":"给定 \\(f(x)=\\begin{cases}ax+1,&x<0\\\\x^2+b,&x\\ge0\\end{cases}\\)。求在 x=0 处可导时 a、b 的值。","correct_answer":"\\(a=0,b=1\\)","split":"validation","steps":["连续要求左极限 1 等于点值 b，所以 b=1。","左导数为 a、右导数 \\(\\lim_{h\\to0^+}h^2/h=0\\)，可导需 a=0。"],"errors":[{"type":"rule_misapplication","signature":"只匹配两侧函数值就断言可导","wrong":"只要 b=1，a 任意都可导。"},{"type":"rule_misapplication","signature":"只匹配两侧斜率而不核对连续","wrong":"a=0 即可，b 可以任意。"}],"pseudo":"会拼接分段函数值，却忘记对两侧斜率施加条件","probes":[{"stem":"若左支为 \\(2x+1\\)、右支为 \\(x^2+1\\)，0 处可导吗？","answer":"不可导，左导数 2 右导数 0。"},{"stem":"为什么可导性检查中连续是必要条件？","answer":"导数存在推出函数在该点连续。"}],"hint":"先做函数值连续性条件，再计算两侧差商极限。","responses":[{"answer":"我先看关键条件：连续要求左极限 1 等于点值 b，所以 b=1。 接着，左导数为 a、右导数 \\(\\lim_{h\\to0^+}h^2/h=0\\)，可导需 a=0。 因而 \\(a=0,b=1\\)","correctness":"correct"},{"answer":"我觉得：只要 b=1，a 任意都可导。","correctness":"incorrect"},{"answer":"我认为：a=0 即可，b 可以任意。","correctness":"incorrect"},{"answer":"我记得结论是：\\(a=0,b=1\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"CAL-010","domain":"微积分与数学分析","education_stage":"大学低年级","difficulty":"D5","topic":"微积分基本定理的条件","concept_id":"C-CAL-007","stem":"设 \\(f(t)=t\\) 且 \\(F(x)=\\int_0^x f(t)\\,dt\\)。求 \\(F'(x)\\) 并说明若换成在某点不连续的函数，还能否无条件断言 \\(F'(x)=f(x)\\)？","correct_answer":"\\(F'(x)=x\\)；不连续时不能无条件在该点使用微积分基本定理的此种结论","split":"train","steps":["计算 \\(F(x)=\\int_0^x t\\,dt=x^2/2\\)。","求导得 \\(F'(x)=x=f(x)\\)；一般需被积函数在所考察点连续才能保证直接等于其点值。"],"errors":[{"type":"condition_ignored","signature":"把微积分基本定理当作无条件点值等式","wrong":"即使 f 在该点跳跃不连续，仍必有 F'(x)=f(x)。"},{"type":"rule_misapplication","signature":"把积分上限变量与积分变量混淆","wrong":"\\(F'(x)=t\\)，因为被积表达式写的是 t。"}],"pseudo":"看过微积分基本定理的证明觉得会了，独立面对不连续点仍机械套用。","probes":[{"stem":"若 \\(f(t)=3t^2\\)，\\(\\frac d{dx}\\int_0^x f(t)dt\\) 为多少？","answer":"\\(3x^2\\)。"},{"stem":"将 f(0) 从 0 改为 10，但别处保持 f(t)=t，F'(0) 还能由新 f(0) 直接给出吗？","answer":"不能，积分不受单点改值影响，F'(0)=0 而新 f(0)=10。"}],"hint":"分清被积变量 t 与上限变量 x，并核对连续条件。","responses":[{"answer":"我先看关键条件：计算 \\(F(x)=\\int_0^x t\\,dt=x^2/2\\)。 接着，求导得 \\(F'(x)=x=f(x)\\)；一般需被积函数在所考察点连续才能保证直接等于其点值。 因而 \\(F'(x)=x\\)；不连续时不能无条件在该点使用微积分基本定理的此种结论","correctness":"correct"},{"answer":"我觉得：即使 f 在该点跳跃不连续，仍必有 F'(x)=f(x)。","correctness":"incorrect"},{"answer":"我认为：\\(F'(x)=t\\)，因为被积表达式写的是 t。","correctness":"incorrect"},{"answer":"我记得结论是：\\(F'(x)=x\\)；不连续时不能无条件在该点使用微积分基本定理的此种结论。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"CAL-011","domain":"微积分与数学分析","education_stage":"大学低年级","difficulty":"D5","topic":"逐点与一致连续的关系","concept_id":"C-CAL-008","stem":"函数 \\(f(x)=x^2\\) 在整个实数轴上一致连续吗？若只看闭区间 \\([0,1]\\) 呢？","correct_answer":"在整个 \\(\\mathbb R\\) 上不一致连续；在 \\([0,1]\\) 上一致连续","split":"train","steps":["取 \\(x_n=n,y_n=n+1/n\\)，有 \\(|x_n-y_n|=1/n\\to0\\)。","但 \\(|f(y_n)-f(x_n)|=2+1/n^2\\not\\to0\\)，故全实轴非一致连续；闭区间上因连续且紧致，一致连续。"],"errors":[{"type":"incorrect_generalization","signature":"把处处连续当作全局一致连续","wrong":"每一点连续，所以在 \\(\\mathbb R\\) 上一致连续。"},{"type":"incorrect_generalization","signature":"把一段区间的一致连续推广到无界域","wrong":"[0,1] 一致连续，因此所有实数上一致连续。"}],"pseudo":"会解释点处连续，却未识别“δ 是否依赖中心点”的差别","probes":[{"stem":"\\(g(x)=x\\) 在实数轴一致连续吗？","answer":"是，因为 \\(|g(x)-g(y)|=|x-y|\\)。"},{"stem":"一致连续的 \\(\\delta\\) 与逐点连续相比，依赖关系有什么不同？","answer":"一致连续的 δ 对全域所有点统一有效，不随选取的点改变。"}],"hint":"寻找两点距离趋零而函数值差仍不小的序列，检验能否统一选 δ。","responses":[{"answer":"我先看关键条件：取 \\(x_n=n,y_n=n+1/n\\)，有 \\(|x_n-y_n|=1/n\\to0\\)。 接着，但 \\(|f(y_n)-f(x_n)|=2+1/n^2\\not\\to0\\)，故全实轴非一致连续；闭区间上因连续且紧致，一致连续。 因而 在整个 \\(\\mathbb R\\) 上不一致连续；在 \\([0,1]\\) 上一致连续","correctness":"correct"},{"answer":"我觉得：每一点连续，所以在 \\(\\mathbb R\\) 上一致连续。","correctness":"incorrect"},{"answer":"我认为：[0,1] 一致连续，因此所有实数上一致连续。","correctness":"incorrect"},{"answer":"我记得结论是：在整个 \\(\\mathbb R\\) 上不一致连续；在 \\([0,1]\\) 上一致连续。但为什么这样，我暂时解释 ":"我记得结论是：\\(EF=12\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"GEO-005","domain":"几何与解析几何","education_stage":"初中","difficulty":"D3","topic":"勾股定理与逆定理","concept_id":"C-GEO-004","stem":"一三角形三边长为 6、8、10，是否为直角三角形？并说明为何不能对任意三角形直接使用勾股等式。","correct_answer":"是直角三角形","split":"train","steps":["最大边为 10，验证 \\(6^2+8^2=36+64=100=10^2\\)。","由勾股定理逆定理可知它是直角三角形；勾股等式并非任意三角形均成立。"],"errors":[{"type":"incorrect_generalization","signature":"把勾股定理当成所有三角形都适用","wrong":"任何三角形都有 \\(a^2+b^2=c^2\\)，不用验证。"},{"type":"rule_misapplication","signature":"不以最长边作为斜边","wrong":"\\(6^2+10^2=8^2\\) 不成立，所以不是直角三角形。"}],"pseudo":"会算三边平方，却不知道为什么只比较两短边之和与最长边平方","probes":[{"stem":"三边 5、6、7 能构成直角三角形吗？","answer":"不能，\\(5^2+6^2=61\\ne49\\)。"},{"stem":"三边 3、4、5 的验证为何使用 5 的平方作等号右侧？","answer":"直角三角形的斜边最长。"}],"hint":"先选最长边为可能斜边，再检验平方等式。","responses":[{"answer":"我先看关键条件：最大边为 10，验证 \\(6^2+8^2=36+64=100=10^2\\)。 接着，由勾股定理逆定理可知它是直角三角形；勾股等式并非任意三角形均成立。 因而 是直角三角形","correctness":"correct"},{"answer":"我觉得：任何三角形都有 \\(a^2+b^2=c^2\\)，不用验证。","correctness":"incorrect"},{"answer":"我认为：\\(6^2+10^2=8^2\\) 不成立，所以不是直角三角形。","correctness":"incorrect"},{"answer":"我记得结论是：是直角三角形。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"GEO-006","domain":"几何与解析几何","education_stage":"初中","difficulty":"D3","topic":"圆周角与圆心角","concept_id":"C-GEO-005","stem":"同一个圆中，一条弧所对的圆心角为 \\(100^\\circ\\)。圆周上另一点所成的、对同一条弧的圆周角是多少？","correct_answer":"\\(50^\\circ\\)","split":"train","steps":["同弧所对圆周角等于圆心角的一半。","\\(100^\\circ/2=50^\\circ\\)，必须保证是同一条弧。"],"errors":[{"type":"rule_misapplication","signature":"直接认为圆心角与圆周角相等","wrong":"\\(100^\\circ\\)。"},{"type":"rule_misapplication","signature":"未辨别对应弧就使用一半关系","wrong":"任意圆周角都是 \\(50^\\circ\\)，无论所对弧是什么。"}],"pseudo":"能背“一半”，却忽视同弧的适用条件","probes":[{"stem":"同弧圆心角 80°，圆周角多少？","answer":"40°。"},{"stem":"若两个圆周角所对弧不同，可以断言它们相等吗？","answer":"一般不能，需比较所对弧。"}],"hint":"先标出每个角两边所截的圆弧，确认是同一弧。","responses":[{"answer":"我先看关键条件：同弧所对圆周角等于圆心角的一半。 接着，\\(100^\\circ/2=50^\\circ\\)，必须保证是同一条弧。 因而 \\(50^\\circ\\)","correctness":"correct"},{"answer":"我觉得：\\(100^\\circ\\)。","correctness":"incorrect"},{"answer":"我认为：任意圆周角都是 \\(50^\\circ\\)，无论所对弧是什么。","correctness":"incorrect"},{"answer":"我记得结论是：\\(50^\\circ\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"GEO-007","domain":"几何与解析几何","education_stage":"初中","difficulty":"D3","topic":"坐标与直线垂直关系","concept_id":"C-GEO-006","stem":"直线 \\(l_1:y=2x+1\\) 与 \\(l_2:y=-\\frac12x+3\\) 是否垂直？说明斜率条件。","correct_answer":"垂直","split":"validation","steps":["两条非竖直直线的斜率分别为 2 和 \\(-1/2\\)。","斜率乘积 \\(2\\times(-1/2)=-1\\)，所以垂直。"],"errors":[{"type":"rule_misapplication","signature":"认为斜率只要互为相反数就垂直","wrong":"\\(y=2x\\) 与 \\(y=-2x\\) 垂直。"},{"type":"rule_misapplication","signature":"把负倒数误读成倒数","wrong":"垂直直线的斜率应为 \\(1/2\\)。"}],"pseudo":"会记住垂直涉及负号，却混淆相反数和负倒数","probes":[{"stem":"斜率为 3 的直线，垂线斜率是多少？","answer":"\\(-1/3\\)。"},{"stem":"竖直直线的斜率不存在，如何判断它的垂线？","answer":"它与水平直线垂直，不适用两个有限斜率相乘的表达式。"}],"hint":"检查两条非竖直直线的斜率乘积是否为 \\(-1\\)，而非相加是否为零。","responses":[{"answer":"我先看关键条件：两条非竖直直线的斜率分别为 2 和 \\(-1/2\\)。 接着，斜率乘积 \\(2\\times(-1/2)=-1\\)，所以垂直。 因而 垂直","correctness":"correct"},{"answer":"我觉得：\\(y=2x\\) 与 \\(y=-2x\\) 垂直。","correctness":"incorrect"},{"answer":"我认为：垂直直线的斜率应为 \\(1/2\\)。","correctness":"incorrect"},{"answer":"我记得结论是：垂直。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"GEO-008","domain":"几何与解析几何","education_stage":"高中","difficulty":"D4","topic":"点到直线距离","concept_id":"C-GEO-006","stem":"求点 \\(P(1,2)\\) 到直线 \\(3x+4y-12=0\\) 的距离。","correct_answer":"\\(\\frac15\\)","split":"train","steps":["代入得 \\(|3\\cdot1+4\\cdot2-12|=1\\)。","法向量长度为 \\(\\sqrt{3^2+4^2}=5\\)，距离为 \\(1/5\\)。"],"errors":[{"type":"rule_misapplication","signature":"忘记用法向量模长归一化","wrong":"距离是 1。"},{"type":"rule_misapplication","signature":"分子不取绝对值","wrong":"距离是 \\(-1/5\\)，因为代入值为 \\(-1\\)。"}],"pseudo":"会套分式公式，却不理解分母是法向量长度","probes":[{"stem":"点 \\((0,0)\\) 到直线 \\(3x+4y-10=0\\) 的距离？","answer":"2。"},{"stem":"为什么点到直线的距离不能是负数？","answer":"距离是长度，须取绝对值并除以法向量长度。"}],"hint":"把分子看作有向代数值，最后用法向量长度转成实际距离。","responses":[{"answer":"我先看关键条件：代入得 \\(|3\\cdot1+4\\cdot2-12|=1\\)。 接着，法向量长度为 \\(\\sqrt{3^2+4^2}=5\\)，距离为 \\(1/5\\)。 因而 \\(\\frac15\\)","correctness":"correct"},{"answer":"我觉得：距离是 1。","correctness":"incorrect"},{"answer":"我认为：距离是 \\(-1/5\\)，因为代入值为 \\(-1\\)。","correctness":"incorrect"},{"answer":"我记得结论是：\\(\\frac15\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"GEO-009","domain":"几何与解析几何","education_stage":"高中","difficulty":"D4","topic":"圆与直线的交点数","concept_id":"C-GEO-007","stem":"求直线 \\(y=0\\) 与圆 \\((x-1)^2+y^2=4\\) 的交点个数及坐标。","correct_answer":"两个交点：\\((-1,0)\\)、\\((3,0)\\)","split":"train","steps":["代入 \\(y=0\\) 得 \\((x-1)^2=4\\)。","解得 \\(x-1=\\pm2\\)，即 \\(x=-1,3\\)，故有两个交点。"],"errors":[{"type":"rule_misapplication","signature":"解平方只取一根","wrong":"只有 \\((3,0)\\) 一个交点。"},{"type":"sign_error","signature":"把判别式正负与交点数对应颠倒","wrong":"\\((x-1)^2=4\\) 判别式大于 0，所以没有交点。"}],"pseudo":"只记判别式规则，却说不清几何上相交、相切、相离的意义","probes":[{"stem":"直线 \\(y=2\\) 与同一圆有几个交点？","answer":"一个，\\((1,2)\\)，它是切线。"},{"stem":"当圆心到直线距离大于半径时，有几个交点？","answer":"零个。"}],"hint":"既可代入求坐标，也可比较圆心到直线的距离与半径。","responses":[{"answer":"我先看关键条件：代入 \\(y=0\\) 得 \\((x-1)^2=4\\)。 接着，解得 \\(x-1=\\pm2\\)，即 \\(x=-1,3\\)，故有两个交点。 因而 两个交点：\\((-1,0)\\)、\\((3,0)\\)","correctness":"correct"},{"answer":"我觉得：只有 \\((3,0)\\) 一个交点。","correctness":"incorrect"},{"answer":"我认为：\\((x-1)^2=4\\) 判别式大于 0，所以没有交点。","correctness":"incorrect"},{"answer":"我记得结论是：两个交点：\\((-1,0)\\)、\\((3,0)\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"GEO-010","domain":"几何与解析几何","education_stage":"高中","difficulty":"D5","topic":"几何命题的反例构造","concept_id":"C-GEO-008","stem":"某人根据画出的几个图形声称：“任意四边形的两条对角线都相等。”判断并给出反例，说明为何几个图形无法证明。","correct_answer":"命题假；例如非正方形的长方形对角线相等，但普通平行四边形未必相等，可举顶点 \\((0,0),(2,0),(3,1),(1,1)\\)","split":"synthetic_test","steps":["取四边形顶点依次为 \\((0,0),(2,0),(3,1),(1,1)\\)，其两条对角线长度分别为 \\(\\sqrt{10}\\) 和 \\(\\sqrt2\\)。","两者不等，构成反例；有限个特殊图形不能证明“任意四边形”。"],"errors":[{"type":"incorrect_generalization","signature":"把矩形的性质推广到所有四边形","wrong":"任意四边形对角线都相等，因为常见画法是矩形。"},{"type":"proof_gap","signature":"错把一个支持例当成全称证明","wrong":"我画出三个对角线相等的例子，因此已经证明。"}],"pseudo":"能流畅讲解特殊图形的性质，却缺乏检验全称命题的反例意识。","probes":[{"stem":"任意平行四边形对角线都互相垂直吗？","answer":"否，一般平行四边形不满足；菱形满足。"},{"stem":"反驳“所有 A 都具有性质 B”需要几个确定反例？","answer":"一个符合 A 但不具有 B 的反例就够。"}],"hint":"先找不具有矩形特殊性质的四边形，再用距离计算对角线。","responses":[{"answer":"我先看关键条件：取四边形顶点依次为 \\((0,0),(2,0),(3,1),(1,1)\\)，其两条对角线长度分别为 \\(\\sqrt{10}\\) 和 \\(\\sqrt2\\)。 接着，两者不等，构成反例；有限个特殊图形不能证明“任意四边形”。 因而 命题假；例如非正方形的长方形对角线相等，但普通平行四边形未必相等，可举顶点 \\((0,0),(2,0),(3,1),(1,1)\\)","correctness":"correct"},{"answer":"我觉得：任意四边形对角线都相等，因为常见画法是矩形。","correctness":"incorrect"},{"answer":"我认为：我画出三个对角线相等的例子，因此已经证明。","correctness":"incorrect"},{"answer":"我记得结论是：命题假；例如非正方形的长方形对角线相等，但普通平行四边形未必相等，可举顶点 \\((0,0),(2,0),(3,1),(1,1)\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-001","domain":"线性代数","education_stage":"大学低年级","difficulty":"D2","topic":"向量与坐标表示","concept_id":"C-LIN-001","stem":"在标准基下平面向量 \\(\\mathbf v=(2,3)\\)。若改用新基 \\(\\mathbf b_1=(1,0),\\mathbf b_2=(1,1)\\)，求 \\(\\mathbf v\\) 的新坐标。","correct_answer":"新基坐标 \\((-1,3)\\)","split":"train","steps":["设 \\(\\mathbf v=c_1(1,0)+c_2(1,1)=(c_1+c_2,c_2)\\)。","比较分量 \\(c_2=3,c_1=-1\\)，向量本身仍为原来的几何对象。"],"errors":[{"type":"representation_translation","signature":"把标准坐标直接当任意基下坐标","wrong":"新坐标仍是 \\((2,3)\\)。"},{"type":"representation_translation","signature":"把改变坐标描述当成改变原向量","wrong":"换基后几何向量变成 \\((-1,3)\\)，原来箭头也改变。"}],"pseudo":"会把向量写成二元组，却不知道二元组依赖所选基","probes":[{"stem":"在此新基下，向量 \\((1,1)\\) 的坐标？","answer":"\\((0,1)\\)。"},{"stem":"为什么同一向量在不同基下坐标可不同？","answer":"坐标是基向量线性组合的系数，取决于所选基。"}],"hint":"把 v 写成新基向量的线性组合，求系数而非直接复制数字。","responses":[{"answer":"我先看关键条件：设 \\(\\mathbf v=c_1(1,0)+c_2(1,1)=(c_1+c_2,c_2)\\)。 接着，比较分量 \\(c_2=3,c_1=-1\\)，向量本身仍为原来的几何对象。 因而 新基坐标 \\((-1,3)\\)","correctness":"correct"},{"answer":"我觉得：新坐标仍是 \\((2,3)\\)。","correctness":"incorrect"},{"answer":"我认为：换基后几何向量变成 \\((-1,3)\\)，原来箭头也改变。","correctness":"incorrect"},{"answer":"我记得结论是：新基坐标 \\((-1,3)\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-002","domain":"线性代数","education_stage":"大学低年级","difficulty":"D2","topic":"矩阵乘法顺序","concept_id":"C-LIN-002","stem":"设 \\(A=\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}\\)，\\(B=\\begin{pmatrix}1&0\\\\1&1\\end{pmatrix}\\)。计算 AB 与 BA，判断是否相等。","correct_answer":"\\(AB=\\begin{pmatrix}2&1\\\\1&1\\end{pmatrix}\\)，\\(BA=\\begin{pmatrix}1&1\\\\1&2\\end{pmatrix}\\)，不相等","split":"train","steps":["按行乘列求 AB：首行为 (2,1)，次行为 (1,1)。","按行乘列求 BA：首行为 (1,1)，次行为 (1,2)，两矩阵不相等。"],"errors":[{"type":"algebraic_manipulation","signature":"把矩阵乘法误认为交换律成立","wrong":"AB=BA，因为实数相乘可交换。"},{"type":"algebraic_manipulation","signature":"把矩阵乘法当逐项相乘","wrong":"AB 的各元素是 \\((1,0;0,1)\\)，所以是单位矩阵。"}],"pseudo":"记住矩阵乘法步骤，却把实数乘法交换律搬进矩阵运算","probes":[{"stem":"若 A 是任意 2×2 矩阵、I 为单位矩阵，AI 与 IA 相等吗？","answer":"相等，都为 A。"},{"stem":"为什么 AB 与 BA 有时甚至不能同时定义？","answer":"乘积的行列维度匹配条件与顺序有关。"}],"hint":"把行乘列写完整，并单独计算两个顺序。","responses":[{"answer":"我先看关键条件：按行乘列求 AB：首行为 (2,1)，次行为 (1,1)。 接着，按行乘列求 BA：首行为 (1,1)，次行为 (1,2)，两矩阵不相等。 因而 \\(AB=\\begin{pmatrix}2&1\\\\1&1\\end{pmatrix}\\)，\\(BA=\\begin{pmatrix}1&1\\\\1&2\\end{pmatrix}\\)，不相等","correctness":"correct"},{"answer":"我觉得：AB=BA，因为实数相乘可交换。","correctness":"incorrect"},{"answer":"我认为：AB 的各元素是 \\((1,0;0,1)\\)，所以是单位矩阵。","correctness":"incorrect"},{"answer":"我记得结论是：\\(AB=\\begin{pmatrix}2&1\\\\1&1\\end{pmatrix}\\)，\\(BA=\\begin{pmatrix}1&1\\\\1&2\\end{pmatrix}\\)，不相等。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-003","domain":"线性代数","education_stage":"大学低年级","difficulty":"D3","topic":"矩阵初等行变换","concept_id":"C-LIN-003","stem":"求线性方程组 \\(x+y=3,\\ 2x+2y=6\\) 的解集和系数矩阵秩。","correct_answer":"无穷多解 \\((x,y)=(t,3-t)\\)；系数矩阵秩为 1","split":"train","steps":["对增广矩阵第二行减去第一行两倍，得到零行。","仅剩独立约束 \\(x+y=3\\)，令 x=t，y=3-t，系数矩阵有 1 个主元。"],"errors":[{"type":"algebraic_manipulation","signature":"把两个方程当两个独立约束","wrong":"两个方程两个未知数，所以唯一解。"},{"type":"incorrect_generalization","signature":"把初等行变换的合法性扩展到任意列变换","wrong":"交换增广矩阵未知数列而不跟踪变量，仍宣称原方程不变。"}],"pseudo":"会做消元，却误认为行数决定独立方程数","probes":[{"stem":"若第二式改成 \\(2x+2y=7\\)，有解吗？","answer":"无解，两式矛盾。"},{"stem":"为什么第二行减去第一行两倍不会改变解集？","answer":"它是可逆的行初等变换，保持行方程的逻辑等价。"}],"hint":"利用行变换检查独立约束数，再用自由变量参数化。","responses":[{"answer":"我先看关键条件：对增广矩阵第二行减去第一行两倍，得到零行。 接着，仅剩独立约束 \\(x+y=3\\)，令 x=t，y=3-t，系数矩阵有 1 个主元。 因而 无穷多解 \\((x,y)=(t,3-t)\\)；系数矩阵秩为 1","correctness":"correct"},{"answer":"我觉得：两个方程两个未知数，所以唯一解。","correctness":"incorrect"},{"answer":"我认为：交换增广矩阵未知数列而不跟踪变量，仍宣称原方程不变。","correctness":"incorrect"},{"answer":"我记得结论是：无穷多解 \\((x,y)=(t,3-t)\\)；系数矩阵秩为 1。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-004","domain":"线性代数","education_stage":"大学低年级","difficulty":"D3","topic":"齐次与非齐次方程组","concept_id":"C-LIN-003","stem":"方程组 \\(x+y=0,\\ 2x+2y=0\\) 有解吗？共有多少自由参数？","correct_answer":"有无穷多解 \\((t,-t)\\)，1 个自由参数","split":"train","steps":["齐次系统总有零解 \\((0,0)\\)。","第二方程是第一方程两倍，只有一个独立约束，取 x=t 得 y=-t。"],"errors":[{"type":"algebraic_manipulation","signature":"认为齐次方程组可能无解","wrong":"两个方程可能互相矛盾，所以无解。"},{"type":"rule_misapplication","signature":"认为齐次只允许零解","wrong":"只要右边是 0，解就必须是 \\((0,0)\\)。"}],"pseudo":"会说齐次有零解，却以为因此不可能有其他解","probes":[{"stem":"\\(x+y=0, x-y=0\\) 的解集？","answer":"唯一零解 \\((0,0)\\)。"},{"stem":"为什么任意齐次线性方程组一定至少有一解？","answer":"所有变量取零必满足右端全为零。"}],"hint":"先检查零解，再根据矩阵秩确定是否存在非零解。","responses":[{"answer":"我先看关键条件：齐次系统总有零解 \\((0,0)\\)。 接着，第二方程是第一方程两倍，只有一个独立约束，取 x=t 得 y=-t。 因而 有无穷多解 \\((t,-t)\\)，1 个自由参数","correctness":"correct"},{"answer":"我觉得：两个方程可能互相矛盾，所以无解。","correctness":"incorrect"},{"answer":"我认为：只要右边是 0，解就必须是 \\((0,0)\\)。","correctness":"incorrect"},{"answer":"我记得结论是：有无穷多解 \\((t,-t)\\)，1 个自由参数。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-005","domain":"线性代数","education_stage":"大学低年级","difficulty":"D4","topic":"线性相关与向量个数","concept_id":"C-LIN-004","stem":"在 \\(\\mathbb R^2\\) 中取三个向量 \\((1,0),(0,1),(1,1)\\)。它们线性相关吗？请写出一个非零系数关系。","correct_answer":"相关，因为 \\((1,1)-(1,0)-(0,1)=(0,0)\\)","split":"train","steps":["第三个向量等于前两个之和。","系数 \\((-1,-1,1)\\) 不全零却线性组合为零，故相关；根本原因是 \\(\\mathbb R^2\\) 维数为 2。"],"errors":[{"type":"rule_misapplication","signature":"将数量多于维数误讲成必然独立","wrong":"三个向量彼此不同，所以线性无关。"},{"type":"rule_misapplication","signature":"只凭向量数目判断、忽略所在空间","wrong":"在 \\(\\mathbb R^3\\) 中任意三个向量也都必相关。"}],"pseudo":"只数向量个数，没有把个数与空间维度联系起来","probes":[{"stem":"在 \\(\\mathbb R^3\\) 中三个标准基向量相关吗？","answer":"不相关。"},{"stem":"为什么 \\(\\mathbb R^2\\) 中三个向量必相关？","answer":"2 维空间最多有 2 个线性无关向量。"}],"hint":"先明确空间维数，再尝试找到非零系数的线性组合等于零。","responses":[{"answer":"我先看关键条件：第三个向量等于前两个之和。 接着，系数 \\((-1,-1,1)\\) 不全零却线性组合为零，故相关；根本原因是 \\(\\mathbb R^2\\) 维数为 2。 因而 相关，因为 \\((1,1)-(1,0)-(0,1)=(0,0)\\)","correctness":"correct"},{"answer":"我觉得：三个向量彼此不同，所以线性无关。","correctness":"incorrect"},{"answer":"我认为：在 \\(\\mathbb R^3\\) 中任意三个向量也都必相关。","correctness":"incorrect"},{"answer":"我记得结论是：相关，因为 \\((1,1)-(1,0)-(0,1)=(0,0)\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-006","domain":"线性代数","education_stage":"大学低年级","difficulty":"D4","topic":"矩阵秩与解空间维数","concept_id":"C-LIN-005","stem":"3 个未知数的齐次线性方程组系数矩阵秩为 2。解空间维数是多少？是否只有零解？","correct_answer":"解空间维数 1；存在非零解","split":"validation","steps":["秩—零化度公式给 \\(\\dim\\ker A=3-2=1\\)。","因此存在一个自由参数，解空间是一维，包含非零向量。"],"errors":[{"type":"algebraic_manipulation","signature":"把方程数等于未知数数当成唯一解","wrong":"三未知数，所以只能有零解。"},{"type":"rule_misapplication","signature":"错误把秩直接当成零空间维数","wrong":"解空间维数是 2。"}],"pseudo":"会计算秩，却不能从秩推断自由度","probes":[{"stem":"若有 5 个未知量且系数矩阵秩为 3，零空间维数？","answer":"2。"},{"stem":"矩阵行数多于列数时一定无解吗（考虑齐次系统）？","answer":"不一定，齐次系统总有零解。"}],"hint":"用自由变量个数 = 未知数数 − 秩，切勿只看方程数。","responses":[{"answer":"我先看关键条件：秩—零化度公式给 \\(\\dim\\ker A=3-2=1\\)。 接着，因此存在一个自由参数，解空间是一维，包含非零向量。 因而 解空间维数 1；存在非零解","correctness":"correct"},{"answer":"我觉得：三未知数，所以只能有零解。","correctness":"incorrect"},{"answer":"我认为：解空间维数是 2。","correctness":"incorrect"},{"answer":"我记得结论是：解空间维数 1；存在非零解。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-007","domain":"线性代数","education_stage":"大学低年级","difficulty":"D4","topic":"线性映射核与像","concept_id":"C-LIN-006","stem":"定义线性映射 \\(T:\\mathbb R^2\\to\\mathbb R^2\\)，\\(T(x,y)=(x+y,0)\\)。求核与像。","correct_answer":"\\(\\ker T=\\{(t,-t):t\\in\\mathbb R\\}\\)；\\(\\operatorname{im}T=\\{(s,0):s\\in\\mathbb R\\}\\)","split":"train","steps":["求核令 \\(x+y=0\\)，得到所有 \\((t,-t)\\)。","像是所有可能输出 \\((x+y,0)\\)，第一坐标可任意取实数。"],"errors":[{"type":"rule_misapplication","signature":"把核固定理解为仅零向量","wrong":"核只有 \\((0,0)\\)。"},{"type":"condition_ignored","signature":"把像当成定义域","wrong":"像是整个 \\(\\mathbb R^2\\)，因为输入来自 \\(\\mathbb R^2\\)。"}],"pseudo":"能流畅解释核与像的定义，却不能通过具体方程写出对应集合。","probes":[{"stem":"\\(T(x,y)=(x,0)\\) 的核是什么？","answer":"\\(\\{(0,t):t\\in\\mathbb R\\}\\)。"},{"stem":"此映射是否满足秩—零化度公式？","answer":"满足，像维数 1 加核维数 1 等于定义域维数 2。"}],"hint":"令输出等于零求核，再遍历所有可能的输出来求像。","responses":[{"answer":"我先看关键条件：求核令 \\(x+y=0\\)，得到所有 \\((t,-t)\\)。 接着，像是所有可能输出 \\((x+y,0)\\)，第一坐标可任意取实数。 因而 \\(\\ker T=\\{(t,-t):t\\in\\mathbb R\\}\\)；\\(\\operatorname{im}T=\\{(s,0):s\\in\\mathbb R\\}\\)","correctness":"correct"},{"answer":"我觉得：核只有 \\((0,0)\\)。","correctness":"incorrect"},{"answer":"我认为：像是整个 \\(\\mathbb R^2\\)，因为输入来自 \\(\\mathbb R^2\\)。","correctness":"incorrect"},{"answer":"我记得结论是：\\(\\ker T=\\{(t,-t):t\\in\\mathbb R\\}\\)；\\(\\operatorname{im}T=\\{(s,0):s\\in\\mathbb R\\}\\)。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-008","domain":"线性代数","education_stage":"大学低年级","difficulty":"D5","topic":"特征值与特征向量","concept_id":"C-LIN-007","stem":"矩阵 \\(A=\\begin{pmatrix}2&0\\\\0&3\\end{pmatrix}\\)。求特征值及对应一组特征向量，零向量算特征向量吗？","correct_answer":"特征值 2、3；对应特征向量可取 \\((1,0)\\)、\\((0,1)\\)；零向量不算","split":"train","steps":["由 \\(Av=\\lambda v\\) 可见坐标轴上的非零向量分别对应比例 2、3。","定义要求特征向量 \\(v\\ne0\\)，零向量虽满足任意 λ 的等式却不能作为特征向量。"],"errors":[{"type":"incorrect_generalization","signature":"把零向量当任意特征值对应的特征向量","wrong":"\\((0,0)\\) 是特征向量，且对应任何特征值。"},{"type":"rule_misapplication","signature":"把矩阵主对角元素作为向量","wrong":"特征向量就是数字 2 和 3。"}],"pseudo":"能求特征方程，却忘记特征向量不能是零向量","probes":[{"stem":"单位矩阵 I 的非零向量都是特征向量吗？","answer":"是，对应特征值 1。"},{"stem":"为什么特征向量必须非零？","answer":"否则对任意 λ 恒有 A0=λ0，概念失去区分性。"}],"hint":"回到特征向量定义，检查非零条件并代入等式。","responses":[{"answer":"我先看关键条件：由 \\(Av=\\lambda v\\) 可见坐标轴上的非零向量分别对应比例 2、3。 接着，定义要求特征向量 \\(v\\ne0\\)，零向量虽满足任意 λ 的等式却不能作为特征向量。 因而 特征值 2、3；对应特征向量可取 \\((1,0)\\)、\\((0,1)\\)；零向量不算","correctness":"correct"},{"answer":"我觉得：\\((0,0)\\) 是特征向量，且对应任何特征值。","correctness":"incorrect"},{"answer":"我认为：特征向量就是数字 2 和 3。","correctness":"incorrect"},{"answer":"我记得结论是：特征值 2、3；对应特征向量可取 \\((1,0)\\)、\\((0,1)\\)；零向量不算。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-009","domain":"线性代数","education_stage":"大学低年级","difficulty":"D5","topic":"矩阵可对角化条件","concept_id":"C-LIN-008","stem":"矩阵 \\(A=\\begin{pmatrix}1&1\\\\0&1\\end{pmatrix}\\) 在实数域能否对角化？说明理由。","correct_answer":"不能对角化","split":"train","steps":["唯一特征值 λ=1，代数重数为 2。","解 \\((A-I)v=0\\) 得 \\(v=(t,0)\\)，特征空间维数仅 1，小于 2，缺少两个线性无关特征向量。"],"errors":[{"type":"rule_misapplication","signature":"只看特征值存在就认为可对角化","wrong":"有特征值 1，所以能对角化。"},{"type":"rule_misapplication","signature":"认为特征值重数为 2 就能找到两条不同特征方向","wrong":"重根 1 自动对应两个线性无关特征向量。"}],"pseudo":"看过对角化例题觉得明白，独立处理重根仍没有计算特征空间。","probes":[{"stem":"单位矩阵 \\(I_2\\) 可对角化吗？","answer":"可以，本身已是对角矩阵且特征空间维数为 2。"},{"stem":"为什么同样有重特征值，\\(I_2\\) 与本题矩阵对角化性质不同？","answer":"几何重数不同，是否存在完整的特征向量基才是关键。"}],"hint":"求 \\(A-I\\) 的零空间维数，再与矩阵阶数比较。","responses":[{"answer":"我先看关键条件：唯一特征值 λ=1，代数重数为 2。 接着，解 \\((A-I)v=0\\) 得 \\(v=(t,0)\\)，特征空间维数仅 1，小于 2，缺少两个线性无关特征向量。 因而 不能对角化","correctness":"correct"},{"answer":"我觉得：有特征值 1，所以能对角化。","correctness":"incorrect"},{"answer":"我认为：重根 1 自动对应两个线性无关特征向量。","correctness":"incorrect"},{"answer":"我记得结论是：不能对角化。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LIN-010","domain":"线性代数","education_stage":"大学低年级","difficulty":"D5","topic":"基变换与线性表示","concept_id":"C-LIN-001","stem":"取旧基为标准基，新基 \\(\\mathbf b_1=(1,1),\\mathbf b_2=(1,-1)\\)。求 \\(v=(2,0)\\) 在新基下坐标，并说明原向量是否变化。","correct_answer":"新坐标为 \\((1,1)\\)，原几何向量未变","split":"train","steps":["设 \\((2,0)=c_1(1,1)+c_2(1,-1)=(c_1+c_2,c_1-c_2)\\)。","解得 \\(c_1=c_2=1\\)，这是同一向量的不同坐标表征。"],"errors":[{"type":"representation_translation","signature":"直接复制标准坐标到新基","wrong":"新坐标还是 \\((2,0)\\)。"},{"type":"rule_misapplication","signature":"认为换基实际改变向量","wrong":"原向量变为 \\((1,1)\\)，即箭头也转向。"}],"pseudo":"能解换基方程，却误认坐标改写就是几何量变化","probes":[{"stem":"向量 \\((0,2)\\) 在此新基坐标？","answer":"\\((1,-1)\\)。"},{"stem":"新基的坐标变换矩阵为什么需要可逆？","answer":"基向量必须线性无关，确保表示唯一并可逆向恢复。"}],"hint":"把 v 表示为新基线性组合，并区分坐标数字与向量对象。","responses":[{"answer":"我先看关键条件：设 \\((2,0)=c_1(1,1)+c_2(1,-1)=(c_1+c_2,c_1-c_2)\\)。 接着，解得 \\(c_1=c_2=1\\)，这是同一向量的不同坐标表征。 因而 新坐标为 \\((1,1)\\)，原几何向量未变","correctness":"correct"},{"answer":"我觉得：新坐标还是 \\((2,0)\\)。","correctness":"incorrect"},{"answer":"我认为：原向量变为 \\((1,1)\\)，即箭头也转向。","correctness":"incorrect"},{"answer":"我记得结论是：新坐标为 \\((1,1)\\)，原几何向量未变。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LOG-001","domain":"逻辑、离散数学与证明","education_stage":"高中","difficulty":"D1","topic":"命题蕴含与真值","concept_id":"C-LOG-001","stem":"判断命题“若整数 n 能被 4 整除，则 n 能被 2 整除”是否为真；反向命题是否为真？","correct_answer":"原命题真，逆命题假","split":"train","steps":["n=4k 可写成 n=2(2k)，因此 4 的倍数一定是 2 的倍数。","逆命题“被 2 整除 ⇒ 被 4 整除”错误，例如 n=2。"],"errors":[{"type":"rule_misapplication","signature":"把真蕴含的逆命题也当作真","wrong":"原命题成立，所以逆命题一定成立。"},{"type":"rule_misapplication","signature":"把数学蕴含当成物理因果","wrong":"原命题必须表示“被 4 整除导致被 2 整除”，否则不是真命题。"}],"pseudo":"会读出“若则”，却认为真命题的逆命题自然成立","probes":[{"stem":"“若 n 被 6 整除，则被 3 整除”是否真？","answer":"真，n=6k=3(2k)。"},{"stem":"如何用反例否定“若 A 则 B”？","answer":"找满足 A 但不满足 B 的例子。"}],"hint":"将条件写成整除式，并单独检验逆命题而非直接交换。","responses":[{"answer":"我先看关键条件：n=4k 可写成 n=2(2k)，因此 4 的倍数一定是 2 的倍数。 接着，逆命题“被 2 整除 ⇒ 被 4 整除”错误，例如 n=2。 因而 原命题真，逆命题假","correctness":"correct"},{"answer":"我觉得：原命题成立，所以逆命题一定成立。","correctness":"incorrect"},{"answer":"我认为：原命题必须表示“被 4 整除导致被 2 整除”，否则不是真命题。","correctness":"incorrect"},{"answer":"我记得结论是：原命题真，逆命题假。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LOG-002","domain":"逻辑、离散数学与证明","education_stage":"高中","difficulty":"D2","topic":"量词否定","concept_id":"C-LOG-002","stem":"否定命题“对所有实数 x，都有 \\(x^2\\ge0\\)”并判断否定命题真假。","correct_answer":"否定为“存在实数 x，使 \\(x^2<0\\)”；该否定命题为假","split":"train","steps":["否定全称量词 \\(\\forall\\) 应改为存在量词 \\(\\exists\\)。","否定谓词 \\(x^2\\ge0\\) 为 \\(x^2<0\\)；任何实数平方均非负，所以否定为假。"],"errors":[{"type":"proof_gap","signature":"只否定谓词保留全称量词","wrong":"对所有实数 x 都有 \\(x^2<0\\)。"},{"type":"proof_gap","signature":"只交换量词而不否定性质","wrong":"存在实数 x 使 \\(x^2\\ge0\\) 就是否定。"}],"pseudo":"只熟记量词符号，却没有同时否定命题内容","probes":[{"stem":"否定“存在整数 n 满足 n>10”。","answer":"对所有整数 n，n≤10。"},{"stem":"为什么反驳全称命题只需一个反例？","answer":"存在一个例子使谓词失败，正是全称命题的否定。"}],"hint":"先交换量词，再对不等式谓词取逻辑否定。","responses":[{"answer":"我先看关键条件：否定全称量词 \\(\\forall\\) 应改为存在量词 \\(\\exists\\)。 接着，否定谓词 \\(x^2\\ge0\\) 为 \\(x^2<0\\)；任何实数平方均非负，所以否定为假。 因而 否定为“存在实数 x，使 \\(x^2<0\\)”；该否定命题为假","correctness":"correct"},{"answer":"我觉得：对所有实数 x 都有 \\(x^2<0\\)。","correctness":"incorrect"},{"answer":"我认为：存在实数 x 使 \\(x^2\\ge0\\) 就是否定。","correctness":"incorrect"},{"answer":"我记得结论是：否定为“存在实数 x，使 \\(x^2<0\\)”；该否定命题为假。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"LOG-003","domain":"逻辑、离散数学与证明","education_stage":"高中","difficulty":"D2","topic":"集合包含与元素关系","concept_id":"C-LOG-003","stem":"设 \\(A=\\{1,2\\}\\)。判断 \\(1\\in A\\)、\\(\\{1\\}\\subseteq A\\)、\\(\\{1\\}\\in A\\) 的真假。","correct_answer":"真、真、假","split":"validation","steps":["1 是 A 的元素，故 \\(1\\in A\\)。","集合 {1} 的唯一元素 1 属于 A，所以 {1} 是 A 的子集；但 A 的元素是数字 1、2，不是集合 {1}。"],"errors":[{"type":"rule_misapplication","signature":"混淆元素与子集","wrong":"\\(\\{1\\}\\in A\\) 为真，因为 1 属于 A。"},{"type":"rule_misapplication","signature":"把单个数字当作集合","wrong":"\\(1\\subseteq A\\) 与 \\(1\\in A\\) 一样。"}],"pseudo":"会写 ∈ 与 ⊆，却把单元素集合和元素视为相同对象","probes":[{"stem":"若 \\(B=\\{\\{1\\},2\\}\\)，\\(\\{1\\}\\in B\\) 吗？","answer":"是，它直接作为 B 的元素。"},{"stem":"空集 \\(\\varnothing\\) 是任何集合的子集吗？","answer":"是。"}],"hint":"把大括号看作创建一个集合对象，分别检查“是元素”还是“所有元素都包含”。","responses":[{"answer":"我先看关键条件：1 是 A 的元素，故 \\(1\\in A\\)。 接着，集合 {1} 的唯一元素 1 属于 A，所以 {1} 是 A 的子集；但 A 的元素是数字 1、2，不是集合 {1}。 因而 真、真、假","correctness":"correct"},{"answer":"我觉得：\\(\\{1\\}\\in A\\) 为真，因为 1 属于 A。","correctness":"incorrect"},{"answer":"我认为：\\(1\\subseteq A\\) 与 \\(1\\in A\\) 一样。","correctness":"incorrect"},{"answer": 高中","difficulty":"D2","topic":"加法原理与乘法原理","concept_id":"C-PRO-002","stem":"食堂有 3 种主食与 2 种饮料，各选一种构成套餐，共有多少种？若只选一种主食或一种饮料，共多少种选择？","correct_answer":"套餐 6 种；单选一种 5 种","split":"validation","steps":["连续独立选择主食和饮料，用乘法原理 \\(3\\times2=6\\)。","互斥的“只选主食”或“只选饮料”，用加法原理 \\(3+2=5\\)。"],"errors":[{"type":"rule_misapplication","signature":"把连续选择误做加法","wrong":"套餐只有 \\(3+2=5\\) 种。"},{"type":"algebraic_manipulation","signature":"把二选一分类误做乘法","wrong":"只买一种东西也有 \\(3\\times2=6\\) 种。"}],"pseudo":"知道加法和乘法口诀，却无法识别问题中的选择结构","probes":[{"stem":"4 件上衣、3 条裤子各选一件有几种搭配？","answer":"12 种。"},{"stem":"“红色帽子 2 款或蓝色帽子 5 款，只买一顶”有几种？","answer":"7 种。"}],"hint":"先问是要连续完成两个步骤，还是在互斥类别中选一个。","responses":[{"answer":"我先看关键条件：连续独立选择主食和饮料，用乘法原理 \\(3\\times2=6\\)。 接着，互斥的“只选主食”或“只选饮料”，用加法原理 \\(3+2=5\\)。 因而 套餐 6 种；单选一种 5 种","correctness":"correct"},{"answer":"我觉得：套餐只有 \\(3+2=5\\) 种。","correctness":"incorrect"},{"answer":"我认为：只买一种东西也有 \\(3\\times2=6\\) 种。","correctness":"incorrect"},{"answer":"我记得结论是：套餐 6 种；单选一种 5 种。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"PRO-003","domain":"概率与组合计数","education_stage":"高中","difficulty":"D2","topic":"排列与组合的顺序","concept_id":"C-PRO-002","stem":"从 5 人中选班长与副班长各 1 人（不能兼任），共有多少种选法？若只选 2 位代表呢？","correct_answer":"班长副班长 20 种；无职位代表 10 种","split":"train","steps":["职务有顺序，班长 5 选、 副班长剩 4 选，得 \\(5\\times4=20\\)。","无序选 2 人，\\(\\binom52=10\\)。"],"errors":[{"type":"rule_misapplication","signature":"把有职位的选择当无序组合","wrong":"班长副班长只有 10 种。"},{"type":"rule_misapplication","signature":"无职位代表也当排列","wrong":"只选 2 位代表有 20 种。"}],"pseudo":"记住排列组合公式，却没有判断顺序是否计数","probes":[{"stem":"从 4 人中选队长、副队长有多少方式？","answer":"12 种。"},{"stem":"什么情况下 \\((A,B)\\) 与 \\((B,A)\\) 算同一种选择？","answer":"当没有角色、顺序不重要时。"}],"hint":"先交换两人看结果是否被视为不同方案。","responses":[{"answer":"我先看关键条件：职务有顺序，班长 5 选、 副班长剩 4 选，得 \\(5\\times4=20\\)。 接着，无序选 2 人，\\(\\binom52=10\\)。 因而 班长副班长 20 种；无职位代表 10 种","correctness":"correct"},{"answer":"我觉得：班长副班长只有 10 种。","correctness":"incorrect"},{"answer":"我认为：只选 2 位代表有 20 种。","correctness":"incorrect"},{"answer":"我记得结论是 ignature":"把均值当多数个体的数值","wrong":"多数数据都等于或接近 4。"},{"type":"rule_misapplication","signature":"把中位数当成均值","wrong":"中位数是 4，因为平均值就是中位数。"}],"pseudo":"会算均值，却把一个中心指标当作所有人或典型个体","probes":[{"stem":"移除 12 后，其余四个数均值是多少？","answer":"2。"},{"stem":"为什么中位数受单个极端值影响通常比均值小？","answer":"中位数依赖排序位置，均值直接包含数值大小。"}],"hint":"分别计算位置统计量与数值平均，再考虑离群点影响。","responses":[{"answer":"我先看关键条件：和为 20，5 个数平均为 4。 接着，排序后的第 3 个为 2，极端值 12 拉高均值。 因而 均值 4，中位数 2；此例中位数更贴近大多数","correctness":"correct"},{"answer":"我觉得：多数数据都等于或接近 4。","correctness":"incorrect"},{"answer":"我认为：中位数是 4，因为平均值就是中位数。","correctness":"incorrect"},{"answer":"我记得结论是：均值 4，中位数 2；此例中位数更贴近大多数。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"STA-002","domain":"统计与数据分析","education_stage":"初中","difficulty":"D1","topic":"中位数与分布","concept_id":"C-STA-001","stem":"数据 1、2、8、9、10 的中位数是多少？若再加入 100，中位数是多少？","correct_answer":"原中位数 8；加入后中位数 8.5","split":"train","steps":["原有 5 个有序值，中位数为第 3 个 8。","加 100 后共 6 个值，中间两项 8 与 9 的平均为 8.5。"],"errors":[{"type":"rule_misapplication","signature":"把中位数与算术平均混淆","wrong":"原中位数是 6，因为这些数的平均是 6。"},{"type":"rule_misapplication","signature":"偶数样本仍只取其中一个中间值","wrong":"新中位数是 8，不需要取两个数的平均。"}],"pseudo":"只熟悉奇数样本，不理解偶数样本中位数的定义","probes":[{"stem":"数据 2、4、6、8 的中位数？","answer":"5。"},{"stem":"加入一个极大值，是否总会使中位数大幅上升？","answer":"不一定，这取决于排序与样本量，通常较稳健。"}],"hint":"先排序数位置，再按样本长度奇偶取中间位置。","responses":[{"answer":"我先看关键条件：原有 5 个有序值，中位数为第 3 个 8。 接着，加 100 后共 6 个值，中间两项 8 与 9 的平均为 8.5。 因而 原中位数 8；加入后中位数 8.5","correctness":"correct"},{"answer":"我觉得：原中位数是 6，因为这些数的平均是 6。","correctness":"incorrect"},{"answer":"我认为：新中位数是 8，不需要取两个数的平均。","correctness":"incorrect"},{"answer":"我记得结论是：原中位数 8；加入后中位数 8.5。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"STA-003","domain":"统计与数据分析","education_stage":"初中","difficulty":"D2","topic":"方差与标准差意义","concept_id":"C-STA-002","stem":"数据 2、4 的总体方差和总体标准差分别是多少？分别用什么单位表示？","correct_answer":"总体方差 1，标准差 1；方差单位为原单位平方、标准差为原单位","split":"train","steps":["均值为 3，平方偏差为 1、1。","总体方差 \\((1+1)/2=1\\)，标准差 \\(\\sqrt1=1\\)；数量相等但量纲不同。"],"errors":[{"type":"rule_misapplication","signature":"把方差和标准差当作同一量","wrong":"两者都始终是同一数且单位相同。"},{"type":"rule_misapplication","signature":"忘记平方后再平均","wrong":"方差为偏差 \\((-1+1)/2=0\\)。"}],"pseudo":"只因一个例子方差和标准差同为 1，就误以为两者普遍相等","probes":[{"stem":"总体数据 0、4 的方差和标准差？","answer":"方差 4，标准差 2。"},{"stem":"若原始数据单位是米，方差单位是什么？","answer":"平方米，标准差为米。"}],"hint":"明确平方偏差、求平均、再开方三步，不要因本题数值相等就混同概念。","responses":[{"answer":"我先看关键条件：均值为 3，平方偏差为 1、1。 接着，总体方差 \\((1+1)/2=1\\)，标准差 \\(\\sqrt1=1\\)；数量相等但量纲不同。 因而 总体方差 1，标准差 1；方差单位为原单位平方、标准差为原单位","correctness":"correct"},{"answer":"我觉得：两者都始终是同一数且单位相同。","correctness":"incorrect"},{"answer":"我认为：方差为偏差 \\((-1+1)/2=0\\)。","correctness":"incorrect"},{"answer":"我记得结论是：总体方差 1，标准差 1；方差单位为原单位平方、标准差为原单位。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"STA-004","domain":"统计与数据分析","education_stage":"初中","difficulty":"D2","topic":"图表纵轴截断","concept_id":"C-STA-003","stem":"一幅柱状图纵轴从 90 而非 0 开始，甲为 100、乙为 110。甲乙数值之比及相对增加百分比是多少？仅看柱高能说乙是甲的两倍吗？","correct_answer":"甲乙比 10:11；乙比甲多 10%；不能说两倍","split":"train","steps":["实际数值分别 100 与 110，比值为 1.1。","基准甲为 100，增加 \\((110-100)/100=10\\%\\)；截断纵轴会夸大视觉高度差。"],"errors":[{"type":"rule_misapplication","signature":"以截断后的柱高比当作数值比","wrong":"乙的柱子看上去高一倍，所以数值是甲的两倍。"},{"type":"condition_ignored","signature":"百分比用乙作分母","wrong":"乙比甲多约 9.09%，因为 \\(10/110\\)。"}],"pseudo":"读懂数字，却仍用视觉长度推断夸大的差异","probes":[{"stem":"若甲 50、乙 60，乙相对甲增长多少？","answer":"20%。"},{"stem":"为什么读柱状图必须查看纵轴是否从 0 开始？","answer":"柱形的视觉长度不一定与真实数量成比例。"}],"hint":"优先读刻度对应的真实数字，再算比例。","responses":[{"answer":"我先看关键条件：实际数值分别 100 与 110，比值为 1.1。 接着，基准甲为 100，增加 \\((110-100)/100=10\\%\\)；截断纵轴会夸大视觉高度差。 因而 甲乙比 10:11；乙比甲多 10%；不能说两倍","correctness":"correct"},{"answer":"我觉得：乙的柱子看上去高一倍，所以数值是甲的两倍。","correctness":"incorrect"},{"answer":"我认为：乙比甲多约 9.09%，因为 \\(10/110\\)。","correctness":"incorrect"},{"answer":"我记得结论是：甲乙比 10:11；乙比甲多 10%；不能说两倍。但为什么这样，我暂时解释不清。","correctness":"partial"}]},{"id":"STA-005","domain":"统计与数据分析","education_stage":"初中","difficulty":"D3","topic":"加权平均数","concept_id":"C-STA-004","stem":"班级 20 人中 15 人考 8 <script>
(function(){
const data=JSON.parse(document.getElementById('dataset').textContent);
const titles={NUM:'数与运算',ALG:'代数与方程',FUN:'函数与图像',GEO:'几何与解析几何',TRI:'三角函数与向量',PRO:'概率与组合计数',STA:'统计与数据分析',CAL:'微积分与数学分析',LIN:'线性代数',LOG:'逻辑、离散数学与证明'};
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>esc(v).replace(/\n/g,'<div></div>');
const short=v=>v.length>62?v.substring(0,62)+'…':v;
let selected='CAL-003';
$('domain').innerHTML='<option value="">全部领域</option>'+Object.entries(titles).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');
function filtered(){const term=$('q').value.trim().toLowerCase(),dom=$('domain').value,diff=$('difficulty').value;return data.filter(x=>(!dom||x.id.startsWith(dom+'-'))&&(!diff||x.difficulty===diff)&&(!term||[x.id,x.topic,x.stem,x.correct_answer,x.pseudo,...x.errors.map(e=>e.signature)].join(' ').toLowerCase().includes(term)));}
function renderList(){const arr=filtered();$('count').textContent=`显示 ${arr.length} / 100 道题 · 点击查看详细标注`;
$('qlist').innerHTML=arr.map(x=>`<button class="qitem ${x.id===selected?'active':''}" data-id="${x.id}"><div class="qhead">${esc(x.id)} · ${esc(x.difficulty)} <span class="muted">${esc(titles[x.id.slice(0,3)])}</span></div><div class="qtopic">${esc(x.topic)}</div><div class="qmeta"><span>${esc(x.education_stage)}</span> · <span>${esc(x.split)}</span></div></button>`).join('')||'<div class="empty">没有匹配题目。</div>';
$('qlist').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.id;renderList();renderDetail();if(window.innerWidth<900)window.scrollTo({top:400,behavior:'smooth'});}));}
function renderDetail(){const x=data.find(z=>z.id===selected);if(!x)return;
const error=x.errors.map((e,i)=>`<div class="smallcard"><b>错误 ${i+1}｜${esc(e.type)}</b><p>${text(e.signature)}</p><p class="wrong">示例：${text(e.wrong)}</p></div>`).join('');
const probes=x.probes.map((p,i)=>`<div class="smallcard"><b>诊断 ${i+1}</b><p>${text(p.stem)}</p><details><summary>查看参考答案</summary><p>${text(p.answer)}</p></details></div>`).join('');
$('detail').innerHTML=`<div class="topline"><span class="pill">${esc(x.id)}</span><span class="pill">${esc(x.difficulty)}</span><span>${esc(titles[x.id.slice(0,3)])}</span><span>·</span><span>${esc(x.education_stage)}</span></div><h2>${esc(x.topic)}</h2><div class="stem">${text(x.stem)}</div>
<section class="section"><h3>标准答案与推理</h3><details><summary>展开标准答案与关键步骤</summary><p class="answer">${text(x.correct_answer)}</p>${x.steps.map((st,i)=>`<div class="step"><b>步骤 ${i+1}</b><div>${text(st)}</div></div>`).join('')}</details></section>
<section class="section"><h3>错误与认知假设</h3><p class="desc">以下均为理论候选错误，不代表真实学生中的发生频率。</p><div class="pair">${error}</div><div class="smallcard" style="margin-top:12px"><b>伪理解风险</b><p>${text(x.pseudo)}</p><p class="desc">答对且未解释充分 ≠ 已被证实为伪理解；还需诊断证据。</p></div></section>
<section class="section"><h3>诊断性追问</h3><div class="pair">${probes}</div></section>
<section class="section"><h3>建议的最小教学提示</h3><div class="smallcard">${text(x.hint)}</div></section>
<section class="section"><h3>模拟学生回答</h3><details><summary>查看 4 条 AI 合成回答</summary>${x.responses.map((r,i)=>`<div class="step"><b>${i+1}. ${esc(r.correctness)}</b><div>${text(r.answer)}</div></div>`).join('')}</details></section>
<div class="notice"><b>研究使用提醒：</b>题目内容与认知标签由 AI 生成；所有模拟回答和教学数据均非真人观察。数据库的自动验证不能代替独立专家和真实学生评估。</div>`;
if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([$('detail')]).catch(()=>{});
}
['q','domain','difficulty'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',renderList));
renderList();renderDetail();
})();
</script>
</body></html>
